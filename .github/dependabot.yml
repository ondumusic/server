version: 2

updates:
  - package-ecosystem: mix
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      images:
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: npm
    directory: "/assets"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
