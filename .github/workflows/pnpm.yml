name: PNPM CI

# Based on https://pnpm.io/continuous-integration#github-actions

on:
  push:
    paths:
      - .github/**
      - assets/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: [24]
    steps:
    - uses: actions/checkout@v6
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        cache: "pnpm"
        cache-dependency-path: assets/pnpm-lock.yaml
    - name: Cache deps
      id: cache-deps
      uses: actions/cache@v5
      env:
        cache-name: cache-pnpm-deps
      with:
        path: deps
        key: ${{ runner.os }}-pnpm-${{ env.cache-name }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-${{ env.cache-name }}-
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      working-directory: assets
    - name: Generate route tree
      run: pnpm run generate-routes
    - name: typescript
      run: pnpm tsc -b
      working-directory: assets
    - name: biome check
      run: pnpm biome check
      working-directory: assets
    - name: run tests
      run: pnpm test
      working-directory: assets
