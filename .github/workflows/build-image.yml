name: Build Image

on:
  # Manual builds of a branch are tagged with the branch name, e.g. `main`.
  workflow_dispatch:
  # Releases, e.g. `1.2.0` or `1.2.0-rc.1`
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

jobs:
  prepare:
    name: Prepare the release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version in mix.exs
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -oP '^\s+version: "\K[^"]+' mix.exs)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::mix.exs has version $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # Check if this is a new release version and should be tagged as latest,
      # instead of possibly a fix for an older version or pre-release. Until
      # there is a stable release, latest follows the pre-releases instead.
      - name: Check if this is the latest release
        id: latest
        run: |
          stable=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -v '[-]' | sort -V | tail -n 1)
          all=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          highest=${stable:-$all}
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  # Use the official docker github builder to build every platform natively
  # on its own runner and combine them into one image. See:
  # https://docs.docker.com/build/ci/github-actions/github-builder/
  build:
    name: Build
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sign: ${{ github.event.repository.private && 'false' || 'auto' }}
      set-meta-labels: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-flavor: latest=false
      meta-tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=raw,value=latest,enable=${{ needs.prepare.outputs.latest }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
