name: Build Image

on:
  # Manual builds of a branch are tagged with the branch name, e.g. `main`.
  workflow_dispatch:
  # Releases, e.g. `1.2.0` or `1.2.0-rc.1`
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the version in mix.exs
        if: github.ref_type == 'tag'
        run: |
          version=$(grep -oP '^\s+version: "\K[^"]+' mix.exs)
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::mix.exs has version $version, but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # Check if this is a new release version and should be tagged as latest,
      # instead of possibly a fix for an older version or pre-release. Until
      # there is a stable release, latest follows the pre-releases instead.
      - name: Check if this is the latest release
        id: latest
        run: |
          stable=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | grep -v '[-]' | sort -V | tail -n 1)
          all=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)
          highest=${stable:-$all}
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v9.2.0

      # https://github.com/tonistiigi/binfmt/issues/215#issuecomment-2613567455
      - name: config change to avoid qemu segment fault
        run: sysctl kernel.randomize_va_space=0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
